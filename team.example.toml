# LDP Releaser team settings: the shared setup every team member uses.
#
# This is a template with placeholder values. The real file is shared
# privately (e.g. through 1Password) and saved by the first-run setup as
# ~/.config/ldp-releaser/ldp-releaser.team.toml. Never commit the real one:
# it describes internal systems and holds the Slack webhook.

[jenkins]
url = "https://ci.example.com"
folder = "my-team"                                    # folder holding the jobs
commit_pattern = 'REVISION=([0-9a-f]{40})'       # commit a build checked out, read from its log

[asah]
build_job = "build-asah"
composer_directory = "composer"                       # optional: enables the Composer tab
composer_script = "scripts/upload_dag.sh"             # run from composer_directory with LCP_PROJECT_ID, PROJECT_ID, REGION
branch_parameter = "BRANCH"
repository = "example-org/asah"                       # where the version tag is created
image_pattern = 'docker push (registry.example.com/asah:\S+)'
tag_suffix_pattern = '\d{8}-[0-9a-f]{7,40}'           # suffix shared by the build's images
tag_format = "{version}"
dependency_file = "common/build.gradle"               # optional: where the fix button adds forces and excludes
main_branch = "main"                                  # optional: fixes go to this branch and to the released one

[faro]
build_job = "build-faro"
deploy_job = "deploy-faro"
branch_parameter = "BRANCH"
environment_parameter = "ENVIRONMENT"
image_parameter = "IMAGE"
repository = "example-org/faro"
image_pattern = 'docker push (registry.example.com/faro:\S+)'
tag_format = "faro-v{version}"

# Deploy environment -> environment the Faro build job is given.
[faro.build_environments]
stg = "stg"
int = "prd"
prd = "prd"

[charts]
repository = "example-org/charts"
develop_branch = "develop"
production_branch = "production"
tag_suffix_key = "tagSuffix"
contributing_url = "https://github.com/example-org/charts/blob/develop/CONTRIBUTING.md"

# Release environment -> values file holding the tag suffix, in release order.
[charts.files]
stg = "deploy/asah/stg.yaml"
int = "deploy/asah/int.yaml"
prd = "deploy/asah/prd.yaml"

# Environments that also need the cherry-pick PR to the production branch.
[charts.production]
environments = ["int", "prd"]

# Optional: merge the charts pull requests once they are approved and these
# checks passed, with these methods. Without it, a person merges them.
[charts.merge]
checks = ["Code analysis"]
develop_method = "squash"           # squash, merge or rebase
production_method = "merge"

[jira]
url = "https://example.atlassian.example"
project = "PROJ"
board_id = 1
component = "Platform"
task_type = "Task"
technical_task_type = "Technical Task"
fix_security_level = "Private"                        # optional, with asah.dependency_file: vulnerability fix tickets get it
title = "Release {environments} Environment{plural}"

[jira.workflow]
task_to_in_progress = ["Selected for Development", "In Progress"]
technical_task_to_in_progress = ["In Progress"]
closed_status = "Closed"
completed_resolution = "Completed"
discarded_resolution = "Discarded"

[argocd]
search = "asah"
# project = "asah"                  # Argo CD project, when it differs from search
image_name = "registry.example.com/asah"   # images whose tag must carry the new suffix

# Release environment -> Argo CD instance that deploys it.
[argocd.urls]
stg = "https://argocd.staging.example.com"
int = "https://argocd.example.com"
prd = "https://argocd.example.com"

# Optional: check rollouts automatically. Environments with applications
# and a read-only token (applications, get) are confirmed by Argo CD; the
# others keep the Confirm rollout button.
[argocd.applications]
stg = ["staging-cluster-asah"]

[argocd.tokens]
stg = ""                            # read-only Argo CD API token, kept in the private team file

[release]
prd_environment = "prd"     # a run touching it is a PRD release: tags + auto-close

[slack]
webhook_url = ""            # optional: Slack workflow called when a charts PR opens

# Optional: gcloud configurations created on each person's machine with their
# own gcloud login. Existing configurations are never changed. The Composer
# tab passes the configuration name as LCP_PROJECT_ID unless lcp_project_id
# says otherwise.
[gcloud.configurations]
staging = { project = "example-staging", region = "us-west1", zone = "us-west1-a" }
prd-eu = { project = "example-prd-eu", region = "europe-west1", zone = "europe-west1-b", lcp_project_id = "eu" }
prd-us = { project = "example-prd-us", region = "us-central1", zone = "us-central1-a" }

# Release environment -> configurations it touches.
[gcloud.environments]
stg = ["staging"]
prd = ["prd-eu", "prd-us"]
